name: CI

on:
  # Pull requests run on open, new commits and reopen; main runs on every merge. A branch push without a pull request
  # runs nothing (open a draft PR, or start the workflow by hand with workflow_dispatch).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request: a new commit cancels its superseded run. Every main commit and manual run has a group
  # of its own (its SHA), so main checks are never cancelled or queued behind each other and PRs never cancel each other.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Backend
        working-directory: backend
        run: python -m pytest -q
      - name: Database (mapping rules)
        working-directory: database
        run: python -m pytest -q

  deploy-config:
    name: Deployment configuration (nginx syntax + rate limits)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: DEV + production sites, snippets and catch-all in a throwaway nginx
        # Official nginx image (>= 1.25 for "http2 on;", as on the VPS); nothing is installed on a server.
        # Official images come through Google's public Docker Hub mirror (no credentials): Docker Hub refuses
        # unauthenticated pulls from the shared runner IPs (toomanyrequests). A tag the mirror lacks fails the job.
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo mirror.gcr.io/library/nginx:1.28
          bash -c "apt-get update -qq >/dev/null && apt-get install -y -qq curl openssl >/dev/null
          && bash tests/e2e/nginx_ratelimit_check.sh"
      - name: Harness leaves the host nginx untouched (Ubuntu 26.04 nginx build, as on the VPS, run as root)
        # Ubuntu's package ships only /var/lib/nginx and /var/log/nginx. nginx itself creates its temp
        # directories (body, proxy, fastcgi, uwsgi, scgi) the first time it initialises its configuration, as
        # root, and hands them to the configured user (www-data). A fresh container never starts the service,
        # so the VPS state is established with the system config's own `nginx -t` (no daemon) and asserted
        # before it is relied on. The harness must leave /var/lib/nginx and /var/log/nginx unchanged; the
        # control proves this environment catches the old bug (an un-isolated `nginx -t` as root hands
        # /var/lib/nginx/body to nginx's default user).
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo mirror.gcr.io/library/ubuntu:26.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null && apt-get install -y -qq nginx curl openssl >/dev/null
            echo "nginx $(nginx -v 2>&1 | cut -d/ -f2); /var/lib/nginx after install: [$(ls -A /var/lib/nginx | tr "\n" " ")]"
            nginx -t -q  # system config, as on the service first start: creates the temp directories
            for t in body proxy fastcgi uwsgi scgi; do
              s=$(stat -c "%U %a" "/var/lib/nginx/$t")
              [ "$s" = "www-data 700" ] || { echo "FAIL setup: /var/lib/nginx/$t is \"$s\", expected www-data 700"; exit 1; }
            done
            state() { find /var/lib/nginx /var/log/nginx -maxdepth 1 -exec stat -c "%n %U:%G %a" {} + | sort; }
            before=$(state)
            echo "established (as on the VPS):"; echo "$before" | sed "s/^/  /"
            bash tests/e2e/nginx_ratelimit_check.sh
            if [ "$(state)" != "$before" ]; then
              echo "FAIL harness changed the system nginx state:"; diff <(echo "$before") <(state) || true; exit 1
            fi
            echo "after the harness: system nginx state unchanged"
            # The old harness behaviour: a config with a server block but no temp paths (nginx registers its
            # compiled-in temp paths while merging server/location configuration, then takes them over as root).
            d=$(mktemp -d); printf "pid %s/p;\nevents {}\nhttp { server { listen 127.0.0.1:18099; } }\n" "$d" > "$d/c.conf"
            nginx -t -q -e "$d/e.log" -p "$d" -c "$d/c.conf"
            control=$(stat -c "%U %a" /var/lib/nginx/body)
            echo "control (un-isolated nginx -t as root): /var/lib/nginx/body -> $control"
            [ "$control" != "www-data 700" ] || { echo "FAIL control did not reproduce the bug"; exit 1; }
            echo "isolation check: PASS"'

  postgres15:
    # DEV runs PostgreSQL 15. Migrations and the role / permission suites run there too, but only when a change can
    # affect them (otherwise this job ends after the scope check, ~15 s). The PostgreSQL-17-only D1 importer tests
    # (MAINTAIN privilege) are excluded; production stays covered by the PostgreSQL 17 job.
    name: PostgreSQL 15 compatibility (migrations + permissions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      HYPERCHAT_CI_DB_SETUP: "1"
      HYPERCHAT_TEST_PG_HOST: localhost
      HYPERCHAT_TEST_MIGRATION_DSN: postgresql+psycopg://hyperchat_migrator@localhost:5432/hyperchat_ci
      HYPERCHAT_TEST_ROLE_DB: hyperchat_ci:5432
      HYPERCHAT_TEST_AUTH_DB: hyperchat_ci:5432
    steps:
      - uses: actions/checkout@v4
      - name: Scope (database, roles, auth, KYC, step-up or CI changes)
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/pg15-scope.sh "$BASE"
      - name: Start PostgreSQL 15 (throwaway container, trust auth)
        if: steps.scope.outputs.run == 'true'
        run: |
          docker run -d --name pg15 -e POSTGRES_HOST_AUTH_METHOD=trust -p 5432:5432 mirror.gcr.io/library/postgres:15
          for i in $(seq 1 60); do docker exec pg15 pg_isready -U postgres -q && break; sleep 1; done
          docker exec pg15 psql -U postgres -tAc "SHOW server_version" | grep -q '^15\.'
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - if: steps.scope.outputs.run == 'true'
        run: pip install -r backend/requirements-dev.txt
      - name: Create roles and the test database, migrate to head
        if: steps.scope.outputs.run == 'true'
        run: bash .github/scripts/setup-test-db.sh hyperchat_ci python
      - name: Database tests (migration round trip, role privileges) without the PostgreSQL-17-only importer
        if: steps.scope.outputs.run == 'true'
        working-directory: database
        run: python -m pytest -q --deselect tests/test_auth_hash_import.py
      - name: Backend permission suites (auth, KYC, step-up, admin, backup)
        if: steps.scope.outputs.run == 'true'
        working-directory: backend
        run: python -m pytest -q tests/auth tests/kyc tests/stepup tests/admin tests/backup

  integration:
    name: Database + integration tests (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17  # Docker Hub's official image via its public mirror (see deploy-config)
        env:
          # Throwaway service container: trust auth, no password exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      HYPERCHAT_CI_DB_SETUP: "1"
      HYPERCHAT_TEST_PG_HOST: localhost
      HYPERCHAT_TEST_MIGRATION_DSN: postgresql+psycopg://hyperchat_migrator@localhost:5432/hyperchat_ci
      HYPERCHAT_TEST_ROLE_DB: hyperchat_ci:5432
      HYPERCHAT_TEST_AUTH_DB: hyperchat_ci:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Create roles and the test database, migrate to head
        run: bash .github/scripts/setup-test-db.sh hyperchat_ci python
      - name: Database tests (migration round trip, role privileges, ETL mapping)
        working-directory: database
        run: python -m pytest -q
      - name: Backend tests (unit + end-to-end against the database)
        working-directory: backend
        run: python -m pytest -q
