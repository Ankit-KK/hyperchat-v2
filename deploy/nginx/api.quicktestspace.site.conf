# HyperChat v2 - DEVELOPMENT API (api.quicktestspace.site -> FastAPI on 127.0.0.1:8000).
# Production will get its own file for api.hyperchat.space at cutover.
# Requires deploy/nginx/snippets/*.conf installed in /etc/nginx/snippets/.
include /etc/nginx/snippets/hyperchat-public-limit-zone.conf;
# Phase 10 (P10-D10): OBS Media Source URLs carry the OBS token in the query string (?token=). Requests under
# /api/v1/obs/ and /api/v1/realtime/ are logged like "combined" but with the path only ($uri, never $args) and
# without the referrer; every other request keeps the usual "combined" line.
log_format hyperchat_dev_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                                 '$status $body_bytes_sent "-" "$http_user_agent"';
map $uri $hyperchat_dev_log_noquery { ~^/api/v1/(obs|realtime)/ 1; default 0; }
map $uri $hyperchat_dev_log_full { ~^/api/v1/(obs|realtime)/ 0; default 1; }
server {
    listen 80;
    server_name api.quicktestspace.site;
    access_log /var/log/nginx/access.log hyperchat_dev_noquery;  # F1-R: the redirect never logs a query string
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.quicktestspace.site;

    ssl_certificate     /etc/letsencrypt/live/api.quicktestspace.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.quicktestspace.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 12m;

    access_log /var/log/nginx/access.log combined if=$hyperchat_dev_log_full;
    access_log /var/log/nginx/access.log hyperchat_dev_noquery if=$hyperchat_dev_log_noquery;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Public read API (Phase 4): per-IP rate limit, otherwise identical proxying.
    location ~ ^/api/v1/(public|metrics)/ {
        include /etc/nginx/snippets/hyperchat-public-limit.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location @hyperchat_rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many requests"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
