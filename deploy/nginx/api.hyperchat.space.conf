# HyperChat v2 - PRODUCTION API (api.hyperchat.space -> FastAPI on 127.0.0.1:8001).
# Install only AFTER /etc/letsencrypt/live/api.hyperchat.space/ exists (until then use
# api.hyperchat.space.acme.conf). Requires the production snippets in /etc/nginx/snippets/:
# hyperchat-prod-public-limit-zone.conf and hyperchat-prod-public-limit.conf (own rate-limit zone).
# Independent of the DEV site api.quicktestspace.site (other server_name, upstream port and zone).
include /etc/nginx/snippets/hyperchat-prod-public-limit-zone.conf;
# Security audit F1: never log query strings or referrers. OBS tokens travel in ?token= (Media Source, Pusher
# auth) and any query or referrer may carry another credential. Like "combined", with the path only ($uri,
# never $args) and "-" for the referrer, plus the upstream status and request time (F1-R: the diagnostics for
# requests whose error-log lines are suppressed below). Checked by tests/e2e/nginx_ratelimit_check.sh.
log_format hyperchat_prod_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                                  '$status $body_bytes_sent "-" "$http_user_agent" us=$upstream_status rt=$request_time';
server {
    listen 80;
    server_name api.hyperchat.space;
    access_log /var/log/nginx/access.log hyperchat_prod_noquery;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.hyperchat.space;

    ssl_certificate     /etc/letsencrypt/live/api.hyperchat.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hyperchat.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 12m;

    access_log /var/log/nginx/access.log hyperchat_prod_noquery;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Public read API (Phase 4): per-IP rate limit (production zone), otherwise identical proxying.
    location ~ ^/api/v1/(public|metrics)/ {
        include /etc/nginx/snippets/hyperchat-prod-public-limit.conf;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Security audit F1-R: OBS tokens travel in ?token= on these paths, and nginx error-log lines (upstream
    # connect failures, timeouts, early closes) carry the full request line with its query. Only critical
    # errors are logged here; every failure still shows in the access log (status, us=, rt=) without the query.
    location ~ ^/api/v1/(obs|realtime)/ {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location @hyperchat_rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many requests"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
