# HyperChat PRODUCTION public read API: per-IP request rate (http context; included once, by the
# api.hyperchat.space site). Own zone: production never shares counters with the DEV zone.
# 10 requests/second per client IP, tracked in 10 MB of shared memory (~160k addresses).
limit_req_zone $binary_remote_addr zone=hyperchat_public_prod:10m rate=10r/s;
