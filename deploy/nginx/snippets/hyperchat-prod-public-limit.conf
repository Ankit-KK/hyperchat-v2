# Applied to /api/v1/public/ and /api/v1/metrics/ of api.hyperchat.space only: bursts of up to 20 extra
# requests are served immediately, anything beyond is rejected with 429 (JSON body via
# @hyperchat_rate_limited). Same behaviour as the DEV snippet, production zone.
limit_req zone=hyperchat_public_prod burst=20 nodelay;
limit_req_status 429;
error_page 429 = @hyperchat_rate_limited;
