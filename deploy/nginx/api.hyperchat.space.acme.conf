# HyperChat v2 - PRODUCTION API, BOOTSTRAP PHASE (port 80 only), installed as
# /etc/nginx/sites-available/api.hyperchat.space ONLY until the Let's Encrypt certificate exists:
#   certbot certonly --webroot -w /var/www/acme -d api.hyperchat.space
# Then replaced by api.hyperchat.space.conf (port 80 + 443). No certificate is referenced here, so
# `nginx -t` passes before the certificate exists. HTTPS requests for this name are refused by the
# catch-all (00-catchall.conf) until the full site is installed.
server {
    listen 80;
    server_name api.hyperchat.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
