# HyperChat lines, inserted ABOVE the default "local all all peer" line of the cluster's pg_hba.conf.
# Unix socket only, peer authentication through the "hyperchat" ident map. No TCP access is added:
# listen_addresses stays 'localhost' and port 5432 is not opened in UFW.
local   all   hyperchat_migrator,hyperchat_app,hyperchat_worker,hyperchat_readonly   peer map=hyperchat
