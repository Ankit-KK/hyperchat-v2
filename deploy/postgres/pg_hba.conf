# HyperChat line, inserted ABOVE the default "local all all peer" line of the cluster's pg_hba.conf
# (deploy/postgres/sync_pg_hba.sh; setup_cluster.sh runs it on every invocation, so a stale line is replaced).
# Unix socket only, peer authentication through the "hyperchat" ident map. No TCP access is added:
# listen_addresses stays 'localhost' and port 5432 is not opened in UFW.
# Every LOGIN role of roles.sql must be listed: a role missing here falls through to the generic "peer" rule,
# which has no map, and cannot connect (tests/test_deploy_isolation.py).
local   all   hyperchat_migrator,hyperchat_app,hyperchat_worker,hyperchat_readonly,hyperchat_lifecycle,hyperchat_auth,hyperchat_stepup   peer map=hyperchat
