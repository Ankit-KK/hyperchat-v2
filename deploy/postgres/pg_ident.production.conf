# HyperChat peer-authentication map for the PRODUCTION cluster 17/hyperchat ONLY.
# It REPLACES the "hyperchat" lines that setup_cluster.sh appended from pg_ident.conf: the DEV API's OS
# user "hyperchat" gets no mapping here, so the DEV API cannot reach the production database; the
# production API runs as "hyperchat-prod". root keeps its mappings (migrations, operator CLI, checks).
# The DEV cluster 15/restoretest keeps pg_ident.conf unchanged.
# MAPNAME   SYSTEM-USERNAME   PG-USERNAME
hyperchat   root              hyperchat_migrator
hyperchat   root              hyperchat_app
hyperchat   root              hyperchat_worker
hyperchat   root              hyperchat_readonly
hyperchat   root              hyperchat_auth
hyperchat   hyperchat-prod    hyperchat_app
hyperchat   hyperchat-prod    hyperchat_worker
hyperchat   hyperchat-prod    hyperchat_lifecycle
hyperchat   hyperchat-prod    hyperchat_auth
